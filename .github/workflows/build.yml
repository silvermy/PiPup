name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools"; Google removed the legacy "tools"
          # package, so the default now fails. The runner image already ships the
          # SDK, build-tools and platforms this build needs.
          packages: ''

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pipup-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
